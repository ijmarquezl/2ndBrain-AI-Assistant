name: Telegram Notifier Cron

on:
  schedule:
    # Run every 20 minutes
    # Note: GitHub Actions schedulers are not precise. Expect +/- delay.
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  notify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install supabase python-telegram-bot python-dotenv dateparser

    - name: Run Notifier Script
      env:
        NOTIFIER_MODE: one_off
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python scripts/notifier.py
